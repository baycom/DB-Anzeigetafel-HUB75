 ; DB Abfahrts-/Ankunftstafel fuer 64x64 HUB75 LED-Panel mit ESP32 Trinity
;
; WICHTIG: Die DBAPI-Library benoetigt auf dem ESP32 eine angepasste
; arduino-esp32 Variante (WiFiClientSecure::setCiphers), damit der
; Akamai-Filter der DB-Schnittstelle die TLS-Verbindung akzeptiert.
; Deshalb wird hier - wie im offiziellen DBAPI-Beispiel - die pioarduino-
; Plattform zusammen mit dem Fork "ArduinoHannover/arduino-esp32#add-setciphers"
; verwendet. Der erste Build laedt daher etwas laenger.

[platformio]
default_envs = trinity

[env:trinity]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32 @ https://github.com/ArduinoHannover/arduino-esp32.git#add-setciphers
board = esp32dev
framework = arduino

; 2 x 1,9 MB App (OTA-Update ueber Web-Frontend) + ~190 kB LittleFS fuer die Konfiguration
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Port wird automatisch erkannt. Falls noetig fest eintragen, z.B.:
;upload_port = /dev/cu.usbserial-110
;monitor_port = /dev/cu.usbserial-110
upload_speed = 115200

lib_ldf_mode = deep
lib_deps =
    ; DBAPI-Fork mit Korrektur der Herkunft bei Ankuenften (Branch fix-arrival-origin,
    ; Basis ArduinoHannover/DBAPI v3.3.2). Fest auf einen Commit gepinnt.
    https://github.com/baycom/DBAPI.git#6d2c2615726fa25878b2964c9156eb52bd05cada
    bblanchon/ArduinoJson @ ^7.3.0
    paulstoffregen/Time @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.10
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Farbtiefe des Panels (Bits pro Farbkanal; nativ 4/6/7/8). 4 Bit halbiert den
    ; DMA-Bildspeicher gegenueber 8 Bit - noetig, weil TLS zur DB-API (RSA-Handshake)
    ; viel freien RAM braucht. Fuer Text mit festen Farben voellig ausreichend.
    -DPIXEL_COLOR_DEPTH_BITS=4
    -DFW_VERSION=\"1.0.0\"
    ; DBAPI Debug-Ausgaben auf Serial aktivieren:
    -DDEBUG_ESP_PORT=Serial

; Optional: Update ueber das Netzwerk statt USB (Web-Frontend -> System -> Firmware)
; Alternativ firmware.bin aus .pio/build/trinity/ im Web-Frontend hochladen.
